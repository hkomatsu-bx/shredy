[package]
name = "shredy-sys"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Thin Windows interop layer for Shredy (reparse-point / file-in-use detection)."

[dependencies]

# ファイル判定は std::os::windows で完結（Q4=A, Effective Rust Item16）。
# タイムゾーン取得（GetTimeZoneInformation）のみ raw FFI が要るため windows-sys を局所導入する。
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_Time", "Win32_Foundation"] }
