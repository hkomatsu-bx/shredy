name: Release

# `v*` タグの push で release ビルドを行い、GitHub Release を作成する。
# 配布バイナリは heic を含めない（--no-default-features）。heic(AGPL) を個人利用・
# 非配布前提とするプロジェクト方針に沿う（CLAUDE.md / deny.toml）。

on:
  push:
    tags:
      - "v*"

# Release 作成にはリポジトリ contents への書き込み権限が必要。
permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  release:
    name: Build and publish (Windows, heic-off)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # build.rs が git コミット数から BUILDNUMBER を採番するため全履歴が必要。
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.97.0"

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      # タグ vX.Y.Z が Cargo.toml の workspace version と一致することを検証する（不一致なら失敗）。
      - name: Verify tag matches crate version
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME#v}"
          ver="$(grep -m1 '^version' Cargo.toml | sed -E 's/.*"([^"]+)".*/\1/')"
          echo "tag=$tag crate=$ver"
          if [ "$tag" != "$ver" ]; then
            echo "::error::タグ ($tag) と Cargo.toml の version ($ver) が不一致です"
            exit 1
          fi

      # 配布バイナリは heic を含めない（--no-default-features）。
      - name: Build release (heic-off)
        run: cargo build --release --no-default-features -p shredy-cli -p shredy-gui

      - name: Package
        shell: bash
        run: |
          name="shredy-${GITHUB_REF_NAME}-x86_64-windows"
          mkdir -p "dist/$name"
          cp target/release/shredy.exe "dist/$name/"
          cp target/release/shredy-gui.exe "dist/$name/"
          cp LICENSE THIRD-PARTY-LICENSES.md README.md README.ja.md "dist/$name/"
          (cd dist && 7z a "$name.zip" "$name" >/dev/null)
          echo "ASSET=dist/$name.zip" >> "$GITHUB_ENV"

      - name: Create GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # プレリリース（v1.0.3-rc1 等、ハイフンを含むタグ）は prerelease 扱いにする。
          prerelease=""
          case "$GITHUB_REF_NAME" in *-*) prerelease="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" \
            --title "Shredy $GITHUB_REF_NAME" \
            --generate-notes \
            $prerelease \
            "$ASSET"
